name: satchel
description: Satchel - serverless password and secrets keeper.
version: 0.2.4+1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  clock: ^1.1.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  intl: any
  riverpod_annotation: ^4.0.7
  satchel_core:
    path: ../../packages/satchel_core
  satchel_storage:
    path: ../../packages/satchel_storage
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

flutter:
  generate: true
  uses-material-design: true
dev_dependencies:
  build_runner: ^2.16.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  riverpod_generator: ^4.0.9
  shared_preferences_platform_interface: ^2.4.2
