# Manual release: tests, builds the web app and a signed Android APK, deploys
# the web app to Firebase Hosting and publishes a GitHub Release with the APK.
#
# The version comes from apps/satchel/pubspec.yaml (`version: X.Y.Z+N`); the
# build number is replaced by the workflow run number so it always grows.
# Bump the pubspec version before releasing: the tag vX.Y.Z must not exist.
#
# Required repository settings (Settings → Secrets and variables → Actions):
#   variable GOOGLE_WEB_CLIENT_ID                     OAuth "Web application" client id
#   secret   FIREBASE_SERVICE_ACCOUNT_SATCHEL_21313   JSON key of a service account that may
#                                                     deploy to Firebase Hosting
#   secret   ANDROID_KEYSTORE_BASE64                  `base64 -w0 upload-keystore.jks`
#   secret   ANDROID_KEYSTORE_PASSWORD
#   secret   ANDROID_KEY_ALIAS
#   secret   ANDROID_KEY_PASSWORD
name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build everything but skip the Firebase deploy and the GitHub Release
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  FIREBASE_PROJECT_ID: satchel-21313

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      build_number: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - name: Read version from pubspec
        id: version
        run: |
          version=$(sed -n 's/^version: *\([0-9][0-9A-Za-z.-]*\).*/\1/p' apps/satchel/pubspec.yaml)
          if [ -z "$version" ]; then
            echo "::error::No version found in apps/satchel/pubspec.yaml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version (build ${{ github.run_number }})" >> "$GITHUB_STEP_SUMMARY"

      - name: Check that the tag is new
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists. Bump 'version' in apps/satchel/pubspec.yaml first."
            exit 1
          fi

      - name: Check required secrets and variables
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          FIREBASE_SERVICE_ACCOUNT_SATCHEL_21313: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SATCHEL_21313 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          [ -n "$GOOGLE_WEB_CLIENT_ID" ] || missing+=("variable GOOGLE_WEB_CLIENT_ID")
          [ -n "$FIREBASE_SERVICE_ACCOUNT_SATCHEL_21313" ] || missing+=("secret FIREBASE_SERVICE_ACCOUNT_SATCHEL_21313")
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || missing+=("secret ANDROID_KEYSTORE_BASE64")
          [ -n "$ANDROID_KEYSTORE_PASSWORD" ] || missing+=("secret ANDROID_KEYSTORE_PASSWORD")
          [ -n "$ANDROID_KEY_ALIAS" ] || missing+=("secret ANDROID_KEY_ALIAS")
          [ -n "$ANDROID_KEY_PASSWORD" ] || missing+=("secret ANDROID_KEY_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing repository %s (Settings → Secrets and variables → Actions)\n' "${missing[@]}"
            exit 1
          fi

  check:
    needs: [prepare]
    uses: ./.github/workflows/check.yml

  build-web:
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - run: flutter pub get

      - name: Generate code
        working-directory: apps/satchel
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build web
        working-directory: apps/satchel
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: >
          flutter build web --wasm --release
          --build-name "${{ needs.prepare.outputs.version }}"
          --build-number "${{ needs.prepare.outputs.build_number }}"
          --dart-define "GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID"

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: apps/satchel/build/web
          if-no-files-found: error

  build-android:
    needs: [prepare, check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - run: flutter pub get

      - name: Generate code
        working-directory: apps/satchel
        run: dart run build_runner build --delete-conflicting-outputs

      # Read by android/app/build.gradle.kts; both files are gitignored.
      - name: Set up release signing
        working-directory: apps/satchel/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > key.properties

      - name: Build APK
        working-directory: apps/satchel
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: >
          flutter build apk --release
          --build-name "${{ needs.prepare.outputs.version }}"
          --build-number "${{ needs.prepare.outputs.build_number }}"
          --dart-define "GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID"

      - name: Remove signing material
        if: always()
        working-directory: apps/satchel/android
        run: rm -f app/upload-keystore.jks key.properties

      - name: Collect APK
        working-directory: apps/satchel
        run: |
          mkdir -p dist
          mv build/app/outputs/flutter-apk/app-release.apk \
            "dist/satchel-${{ needs.prepare.outputs.version }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: apps/satchel/dist/*.apk
          if-no-files-found: error

  deploy-web:
    needs: [build-web]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      # For firebase.json.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: web
          path: apps/satchel/build/web

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SATCHEL_21313 }}
          channelId: live
          projectId: ${{ env.FIREBASE_PROJECT_ID }}

  release:
    needs: [build-android]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release create "$TAG" dist/*.apk \
            --target "$GITHUB_SHA" \
            --title "Satchel $VERSION" \
            --generate-notes
          echo "Published https://github.com/$GH_REPO/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
