name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - run: flutter pub get

      - name: Generate code
        working-directory: apps/satchel
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test satchel_core
        working-directory: packages/satchel_core
        run: dart test

      - name: Test satchel_storage
        working-directory: packages/satchel_storage
        run: flutter test

      # Browser-only providers (IndexedDB); run both web compilers. The web
      # runner compiles all given files together, so VM-only tests under
      # test/directory/ (dart:io, SAF/jni) are excluded by the glob.
      - name: Test satchel_storage (Chrome)
        working-directory: packages/satchel_storage
        run: |
          flutter test --platform chrome test/*_test.dart
          flutter test --platform chrome --wasm test/*_test.dart

      - name: Test app
        working-directory: apps/satchel
        run: flutter test

  build-web:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - run: flutter pub get

      - name: Generate code
        working-directory: apps/satchel
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build web
        working-directory: apps/satchel
        run: flutter build web --wasm
